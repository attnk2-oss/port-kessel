<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#03070d">
<meta name="description" content="NEON HARBOR: an open-world crime game in the rain-soaked port city of Port Kessel.">
<title>NEON HARBOR · Port Kessel</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #03070d; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  noscript { position: absolute; inset: 0; display: grid; place-items: center; color: #dff9fa; font: 20px sans-serif; }
</style>
</head>
<body>
<canvas id="game" aria-label="NEON HARBOR, an open-world crime game in the rain-soaked port city of Port Kessel"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript>NEON HARBOR needs JavaScript.</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
